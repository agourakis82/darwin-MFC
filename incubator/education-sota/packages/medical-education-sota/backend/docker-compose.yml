version: '3.8'

services:
  # Banco de dados principal (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: medical_edu_postgres
    environment:
      POSTGRES_DB: medical_education_sota
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: medical_password_2025
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - medical_edu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_user -d medical_education_sota"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: medical_edu_redis
    command: redis-server --appendonly yes --requirepass redis_password_2025
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - medical_edu_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # MongoDB para analytics e conteúdo
  mongodb:
    image: mongo:7
    container_name: medical_edu_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password_2025
      MONGO_INITDB_DATABASE: medical_analytics
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - medical_edu_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # InfluxDB para métricas de tempo real
  influxdb:
    image: influxdb:2.7
    container_name: medical_edu_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: influx_password_2025
      DOCKER_INFLUXDB_INIT_ORG: medical-education
      DOCKER_INFLUXDB_INIT_BUCKET: medical_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: medical-influx-token-2025
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - medical_edu_network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Elasticsearch para busca e logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: medical_edu_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - medical_edu_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kibana para visualização de logs
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: medical_edu_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - medical_edu_network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Backend API (Node.js)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical_edu_backend
    environment:
      NODE_ENV: development
      PORT: 8002
      DATABASE_URL: postgresql://medical_user:medical_password_2025@postgres:5432/medical_education_sota
      REDIS_URL: redis://:redis_password_2025@redis:6379
      MONGODB_URL: mongodb://mongo_admin:mongo_password_2025@mongodb:27017/medical_analytics
      INFLUXDB_URL: http://influxdb:8086
      ELASTICSEARCH_URL: http://elasticsearch:9200

      # JWT Secrets
      JWT_SECRET: jwt_secret_medical_education_sota_2025
      JWT_REFRESH_SECRET: jwt_refresh_secret_medical_education_sota_2025

      # IA/LLM APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Blockchain
      BLOCKCHAIN_PROVIDER_URL: ${BLOCKCHAIN_PROVIDER_URL}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY}

      # LMS Integration
      MOODLE_API_URL: ${MOODLE_API_URL}
      MOODLE_API_TOKEN: ${MOODLE_API_TOKEN}

      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}

      # AWS (para storage)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

      # Monitoring
      PROMETHEUS_PORT: 9090
      GRAFANA_PORT: 3001

    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./logs:/app/logs
    ports:
      - "8002:8002"
      - "9090:9090"  # Prometheus
    networks:
      - medical_edu_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # WebSocket para tempo real
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: medical_edu_websocket
    environment:
      NODE_ENV: development
      PORT: 8003
      REDIS_URL: redis://:redis_password_2025@redis:6379
      JWT_SECRET: jwt_secret_medical_education_sota_2025
    volumes:
      - ./src/websocket:/app/src/websocket
      - ./logs:/app/logs
    ports:
      - "8003:8003"
    networks:
      - medical_edu_network
    depends_on:
      - redis
    restart: unless-stopped

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: medical_edu_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - medical_edu_network
    restart: unless-stopped

  # Grafana para dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: medical_edu_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana_admin_password_2025
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    networks:
      - medical_edu_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # API Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: medical_edu_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"  # Frontend
    networks:
      - medical_edu_network
    depends_on:
      - backend
      - websocket
    restart: unless-stopped

  # MinIO para object storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: medical_edu_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2025
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - medical_edu_network
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # RabbitMQ para filas de jobs
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: medical_edu_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: medical_user
      RABBITMQ_DEFAULT_PASS: rabbitmq_password_2025
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - medical_edu_network
    restart: unless-stopped

  # Worker para processamento de jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: medical_edu_worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://medical_user:medical_password_2025@postgres:5432/medical_education_sota
      REDIS_URL: redis://:redis_password_2025@redis:6379
      RABBITMQ_URL: amqp://medical_user:rabbitmq_password_2025@rabbitmq:5672
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./src/worker:/app/src/worker
      - ./logs:/app/logs
    networks:
      - medical_edu_network
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

networks:
  medical_edu_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  influxdb_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local